services:
  - type: web
    name: flowgeniq-payments
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --omit=dev && npm test
    startCommand: npm start
    healthCheckPath: /readyz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PAYMENT_VERIFICATION_ENABLED
        value: "true"
      - key: CHECKOUT_SIGNING_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flowgeniq-payments-db
          property: connectionString

databases:
  - name: flowgeniq-payments-db
    plan: basic-256mb
    region: oregon
    diskSizeGB: 1
    ipAllowList: []
