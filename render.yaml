services:
  - type: web
    name: flowgeniq-payments
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --omit=dev && npm test
    startCommand: npm start
    healthCheckPath: /readyz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: test
      - key: SHOP_ENABLED
        value: "false"
      - key: CATALOG_APPROVED
        value: "false"
      - key: ENABLED_PROVIDERS
        value: stripe,paypal
      - key: CHECKOUT_SIGNING_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flowgeniq-payments-db
          property: connectionString

databases:
  - name: flowgeniq-payments-db
    plan: basic-256mb
    region: oregon
    diskSizeGB: 1
    ipAllowList: []
